name: ktm2000-prod

services:
  postgres:
    image: postgres:15-alpine
    container_name: ktm2000-postgres-prod
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ktm2000_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ktm2000_prod_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ktm2000_prod}
    expose:
      - "5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-../../data/postgres-prod}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    image: ktm2000-backend:latest
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ktm2000-backend-prod
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - ../../.env.prod
      # Note: env_file does NOT resolve ${VAR} references.
      # OIDC vars with ${OPS_PUBLIC_IP} are in environment: below.
    extra_hosts:
      # OIDC token/JWKS from container → host Authentik :9000
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ktm2000_user}:${POSTGRES_PASSWORD:-ktm2000_prod_pass}@postgres:5432/${POSTGRES_DB:-ktm2000_prod}
      ENV: prod
      SECRET_KEY: ${SECRET_KEY:-ktm2000-prod-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8082}
      # Корень хранения файлов (ADR-0026); products/imports/backups — производные.
      STORAGE_ROOT: /app/storage
      # OIDC / Authentik SSO — vars with ${OPS_PUBLIC_IP} ARE resolved here
      AUTH_OIDC_ENABLED: 'true'
      AUTH_OIDC_CLIENT_ID: ktm2000
      AUTH_OIDC_CLIENT_SECRET: ''
      AUTH_OIDC_ISSUER: http://${OPS_PUBLIC_IP}:9000/application/o/ktm2000/
      AUTH_OIDC_REDIRECT_URI: http://${OPS_PUBLIC_IP}:8082/auth/callback
      AUTH_OIDC_TOKEN_URL: http://${OPS_PUBLIC_IP}:9000/application/o/token/
      AUTH_OIDC_JWKS_URL: http://${OPS_PUBLIC_IP}:9000/application/o/ktm2000/jwks/
      AUTH_OIDC_SCOPES: openid profile email ktm_access
      AUTH_OIDC_ALLOW_JIT: 'true'
      AUTH_OIDC_DEFAULT_ROLE: admin
      # HRMS employee sync
      HRMS_BASE_URL: http://host.docker.internal:8086
    expose:
      - "8000"
    volumes:
      - ../../data/storage-prod:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "until python -c 'import socket; s=socket.create_connection((\"postgres\", 5432), 3); s.close()'; do sleep 2; done &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ktm2000-frontend:latest
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: ktm2000-frontend-prod
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    expose:
      - "80"
    depends_on:
      - backend
    restart: always
    # Объявление #380 (запуск `docker compose -f infra/compose/docker-compose.prod.yml
    # config -q` и аудит `backend/scripts/audit_compose.py`; прод-контейнеры этой
    # машиной НЕ перезапускались — блок вступит в силу на следующем плановом `up`).
    # Проба локальная: nginx отдаёт SPA с этого же контейнера, зависимостей от
    # backend в healthcheck нет (иначе он падал бы заодно с бэкендом).
    # `curl` есть в образе: frontend/Dockerfile — `FROM nginx:alpine`, а в истории
    # базового образа последний слой `apk add --no-cache curl ca-certificates`.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: ktm2000-nginx-prod
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "8082:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - shared_gateway
    depends_on:
      - frontend
      - backend
    restart: always
    # Объявление #380: edge-nginx проверяется сквозной пробой `/api/health` —
    # это одновременно «nginx отвечает», «прокси жив» и «backend отдаёт health»
    # (backend сам по себе уже имеет healthcheck на :8000). Дыра без этой пробы:
    # nginx healthy даже когда весь upstream мёртв, потому что слушает он всегда.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.7
    # Тег закреплён (#380/#367): `:latest` означал развёртывание, которое нельзя
    # повторить. 2026.10.7 — стабильный тег, на который указывал `latest` на момент
    # правки (Docker Hub API, тег обновлён 2026-10-30T17:22:44Z); обновления ведёт
    # dependabot с экосистемой docker (#367, срез A).
    container_name: ktm2000-cloudflared-prod
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    network_mode: "service:nginx"
    depends_on:
      - nginx
    command: >
      tunnel --url http://127.0.0.1:80 --protocol http2 --no-autoupdate
    restart: unless-stopped

networks:
  shared_gateway: {}
