name: ktm2000-test

services:
  postgres:
    image: postgres:15-alpine
    container_name: ktm2000-postgres-test
    # Значения захардкожены: conftest ожидает фиксированный контракт
    # localhost:5441/ktm2000_test, env-переменные окружения не должны его менять.
    environment:
      POSTGRES_USER: ktm2000_user
      POSTGRES_PASSWORD: ktm2000_pass_test
      POSTGRES_DB: ktm2000_test
    # Оба loopback-биндинга обязательны: asyncpg резолвит 'localhost' на ::1
    # первым и виснет ~2с на [::1], если порт опубликован только на IPv4
    # (Docker Desktop, Windows). С [::1] и 127.0.0.1 коннект мгновенный.
    # Только loopback — порт не выходит за пределы машины.
    ports:
      - "127.0.0.1:5441:5432"
      - "[::1]:5441:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Потолок лога и политика restart (#380) — правило из AGENTS.md («Логи
    # контейнеров») действует и для тестового стенда: без блока json-лог
    # неограничен, а на этой машине нет хостового logrotate.
    # Оба сервиса этого файла пересоздаются при `up`, и он пересоздаст их при
    # следующем `db:up`: данные тестовой БД на tmpfs, терять при пересоздании
    # нечего, но окно лучше выбирать без живых pytest-прогонов (run-DB соседей
    # живут на этом же сервере).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: ktm2000-backend-test
    env_file:
      - ../../.env.test
    environment:
      DATABASE_URL: postgresql+asyncpg://ktm2000_user:ktm2000_pass_test@postgres:5432/ktm2000_test
      ENV: test
      CORS_ORIGINS: "*"
      # E2E/pytest escape hatch (deps._get_current_user_dev): запросы без токена
      # резолвятся в сидированного system@local — иначе break-glass (id=0,
      # вне таблицы users по ADR-0006) роняет FK на created_by/audit_logs.
      DEV_BYPASS_AUTH: "true"
    expose:
      - "8000"
    volumes:
      - storage_test_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # Проба через urllib, а не curl: базовый образ python:3.14-slim-bookworm
    # (backend/Dockerfile) curl не содержит, а python в нём есть всегда.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: ktm2000-frontend-test
    # Образ frontend — nginx с полным конфигом (SPA + /api → backend:8000),
    # слушает 80; отдельный edge-nginx не нужен.
    ports:
      - "${EXTERNAL_PORT:-8100}:80"
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
    # curl есть в образе: frontend/Dockerfile — FROM nginx:alpine, последний
    # слой базового образа `apk add --no-cache curl ca-certificates`.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_test_data:
  storage_test_data:
