# Скоуп ruff для репозитория — решение грилла #245 (Q1=1), тикет #248.
#
# Дефолтный набор ruff 0.16.9 даёт в `backend/` 3203 находки, в которых
# корректностные дефекты тонут среди стилевых семейств: FURB157 1504,
# I001 425, B008 384, UP007 189 — против ~200 настоящих дефектов
# (F821 undefined-name 55, F401 82, F841 50, F811 10).
# Report-only отчёт такого размера никто не читает, поэтому первый заход
# сужен до pyflakes-ядра: всё, что здесь находит ruff, — дефект кода.
# Расширение скоупа — отдельным решением.
target-version = "py312"

[lint]
select = ["F"]
