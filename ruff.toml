# Скоуп ruff для репозитория. Точка входа — тикет #248 (pyflakes-ядро, 0 находок),
# расширение — тикет #260 («механические семейства»): каждое семейство доведено до
# нуля отдельной волной, с полным прогоном `npm run test:pytest` после волны.
#
# Что вошло (находок до → после):
#   F         ~200 → 0   pyflakes-ядро (база #248, не сломалась)
#   I001      421  → 0   сортировка импортов
#   UP006/7/17/35/37/45  386 → 0  PEP 604/585, снятие deprecated typing, `datetime.UTC`
#   FURB157   1519 → 0   verbose-decimal-constructor
#   RUF059    62   → 0   unused-unpacked-variable (ручной rename → `_name`)
#   PIE       34   → 0   PIE790 + PIE810
#   C4        20   → 0   C408/C401/C416/C420
#   SIM       39   → 0   SIM101/102/103/105/108/117/300
#   B008      384  → 0   не код-фикс: extend-immutable-calls (ниже)
#
# Расширение — закрытие контура (решения грилла #245, тикет #259): сначала каждый код
# доведён до нуля, и только потом включён в select.
#   DTZ            22 → 0   инстанты — явный UTC; осознанно локальные шкалы (расписание
#                           авто-бэкапа, метка в имени файла, dev-снапшот, date-only парсер
#                           Excel) помечены точечными `noqa` с обоснованием
#   BLE001 + S110  40 → 0   `except Exception` сужены до реальных классов; где широкий
#                           перехват — часть контракта (health-probe, CLI-барьер, best-effort
#                           пересборка), он логирует трейс и помечен `noqa` с причиной
#   ASYNC          25 → 0   ASYNC230 починен (`anyio.open_file` вместо блокирующего `open`);
#                           ASYNC221 — per-file-ignore для тестов миграций (ниже);
#                           ASYNC240 — починен (#267): блокирующие path-операции в
#                           async-функциях вынесены в `asyncio.to_thread`
#   PLW1510         5 → 0   явный `check=False` там, где `returncode` разбирает вызывающий
#   TRY004/201/401 10 → 0   `TypeError` для валидации типов, `raise` вместо `raise exc`,
#                           без дублирования трейса в `logger.exception`
#   PLR0124/1704    3 → 0   явная NaN-проверка (`math.isnan`), переименование локальной
#                           переменной, перекрывавшей аргумент
#   PERF102, G201, RUF010, RUF015, RUF022, RUF046, RUF100,
#   PYI041, PYI061, RET501, B010, D419   ~45 → 0
#
# НЕ вошли (до нуля не доводятся / вне механики):
#   UP042 (35, `str`+`Enum` → `StrEnum` — смена семантики `str(member)`)
#   UP047 (1, PEP 695 generic)
#   PLR2004 (1868) + PLR09xx (330) и прочие PLR — пороги/магия, не механизируются
#   RUF001/002/003 (~6000, ambiguous unicode — русский текст в строках и комментариях)
#   PLC0414 (3) — конфликтует с идиомой явного реэкспорта `X as X`, которой требует F401
#                 (`TokenError as TokenError`, `import httpx as httpx`,
#                 `_release_via_take_to_work as ...`). Включать нельзя, не сломав F401-чистоту.
#   TRY003 (326, raise-vanilla-args), TRY300 (13), TRY301 (12) — вкусовые требования
#                 к форме `raise`/`try`, не дефекты.
# Из-за UP042/UP047 выбран явный список UP-кодов, а не семейство `UP` целиком;
# по той же причине TRY включён тремя кодами, а не семейством.
target-version = "py312"

[lint]
select = [
    "F",
    "I",
    "UP006",
    "UP007",
    "UP017",
    "UP035",
    "UP037",
    "UP045",
    "FURB",
    "RUF059",
    "PIE",
    "C4",
    "SIM",
    "B008",
    "DTZ",
    "BLE",
    "S110",
    "ASYNC",
    "PLW1510",
    "TRY004",
    "TRY201",
    "TRY401",
    "PLR0124",
    "PLR1704",
    "PERF102",
    "G201",
    "RUF010",
    "RUF015",
    "RUF022",
    "RUF046",
    "RUF100",
    "PYI041",
    "PYI061",
    "RET501",
    "B010",
    "D419",
]

[lint.flake8-bugbear]
# B008: вызовы в дефолтах-зависимостях FastAPI — не дефект. Помимо самого
# `Depends`, ruff рекурсивно смотрит вложенные вызовы, поэтому сюда же попадает
# `app.api.deps.require_role(...)` — фабрика зависимости (`Depends(require_role(...))`).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
    "app.api.deps.require_role",
]

[lint.per-file-ignores]
# `app.models.__init__` намеренно импортирует `app.stock.*` ПОСЛЕ моделей:
# иначе circular import (`app.stock.services` тянет `app.models`). I001 требует
# обратного порядка — оставляем осознанное исключение для этого модуля.
"backend/app/models/__init__.py" = ["I001"]
# Постоянных исключений по I001/RUF100 больше нет: `repair_route_operations.py`
# был незакоммиченным WIP на момент #260, теперь он в репозитории и проходит
# общие правила.
# `ASYNC221` — `subprocess.run(["alembic", ...])` внутри async-тестов миграций:
# синхронный запуск осознанный. Это тесты, а не прод: pytest-asyncio даёт каждой
# тестовой корутине свой event loop, во время `subprocess.run` в нём больше нечего
# планировать, а xdist разносит тесты по процессам. `asyncio.to_thread` ничего не
# разблокирует и только усложнит чтение.
"backend/tests/test_migrations.py" = ["ASYNC221"]
