name: Sync

# Статус: REPORT-ONLY (информационный), пересмотр — 2027-06-30.
#
# Джоб `sync` не входит в required checks
# (`gh api repos/mavkasgit/ktm2000/branches/main/protection`), поэтому красное
# здесь merge не блокирует. Причина: второй репозиторий (`mavkasgit/hrms`)
# живёт своим циклом и не подчиняется нашим срокам — красный по чужому
# состоянию не должен останавливать работу KTM. Это не «шум, который не
# замечают»: результат виден в PR и в baseline ниже. Перевод джоба в
# блокирующие — отдельное решение на дату пересмотра (2027-06-30), та же дата
# стоит в `expires` записей `scripts/sync-baseline.json`.
#
# Зачем отдельный workflow: дрейф shared-файлов не видит ни один другой джоб.
# `scripts/verify-sync.mjs` сверяет файлы из `scripts/sync-manifest.json` с
# `mavkasgit/hrms`; без этого джоба расхождение ловилось только на машине
# разработчика (pre-push) или не ловилось вовсе (#417).
#
# Известный долг подавляется снимком `scripts/sync-baseline.json`
# (`path + kind + hash` локального файла на момент снимка, `reviewed/expires`);
# такое расхождение печатается как `known`. Всё, чего в снимке нет, — красный
# прогон. Запись, которая больше не нужна, печатается как `stale` и не валит
# джоб — чтобы долг убирали, а не копили.
#
# Фильтра `paths` нет намеренно: дрейф появляется от правки в ЛЮБОМ из двух
# репозиториев, а прогон дешёвый — только node builtins, без npm install.
#
# Два checkout кладут репозитории соседями в workspace прогона, чтобы
# `--other ../hrms` означал то же, что на машине разработчика. На PR
# сознательно сравнивается default-ветка `hrms`, а не одноимённая: ветки с тем
# же именем во втором репозитории обычно нет, и checkout по несуществующему
# ref давал бы ложное красное вместо сигнала о реальном дрейфе. hrms публичный,
# поэтому его читает default GITHUB_TOKEN со скоупом `contents: read` —
# отдельный секрет не нужен.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

# #363 [missing-permissions]: по умолчанию GITHUB_TOKEN получает запись во все
# скоупы репозитория. Здесь читаем — поэтому верхний уровень только `contents: read`.
permissions:
  contents: read

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    # Замера не было: джоб новый. Два checkout и запуск скрипта на builtins —
    # минута с большим запасом; 10 минут покрывают очередь раннера.
    timeout-minutes: 10
    steps:
      - name: Checkout ktm2000
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ktm2000
          # #363 [artipacked]: checkout иначе пишет GITHUB_TOKEN в .git/config
          # workspace. Здесь токен — только на чтение публичного hrms.
          persist-credentials: false

      - name: Checkout hrms
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mavkasgit/hrms
          path: hrms
          # Без `ref` — default-ветка hrms, в том числе на PR. Одноимённая ветка
          # во втором репозитории обычно отсутствует; checkout по ней давал бы
          # ложное красное вместо сигнала о дрейфе. Осознанно, см. шапку.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ktm2000/.nvmrc

      - name: Verify sync
        working-directory: ktm2000
        run: node scripts/verify-sync.mjs --other ../hrms --baseline scripts/sync-baseline.json
