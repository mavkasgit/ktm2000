name: Migrations

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ktm2000_user
          POSTGRES_PASSWORD: ktm2000_pass_test
          POSTGRES_DB: ktm2000_test
        ports:
          - 5212:5432
        options: >-
          --health-cmd "pg_isready -U ktm2000_user -d ktm2000_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://ktm2000_user:ktm2000_pass_test@localhost:5212/ktm2000_test
      TEST_DATABASE_URL: postgresql+asyncpg://ktm2000_user:ktm2000_pass_test@localhost:5212/ktm2000_test
      ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install npm dependencies
        run: npm ci

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrate and drift check
        run: cd backend && alembic upgrade head && alembic check

      - name: Run migration tests
        env:
          TEST_DB_PORT: 5212
        run: |
          RUN_ID=$(python -c "import uuid; print(uuid.uuid4().hex[:12])")
          DB_NAME="ktm2000_test_${RUN_ID}"
          trap 'python scripts/test-db.py drop "$DB_NAME" >/dev/null 2>&1 || true' EXIT
          python scripts/test-db.py create "$DB_NAME"
          cd backend
          TEST_DATABASE_URL="postgresql+asyncpg://ktm2000_user:ktm2000_pass_test@localhost:5212/${DB_NAME}" pytest tests/test_migrations.py -v

      - name: Validate seeds and generated labels
        run: cd backend && python scripts/validate_seeds.py && python scripts/generate_frontend_labels.py --check

      - name: Verify profile-settings manifest (strict)
        working-directory: .
        run: python scripts/verify-profile-settings.py verify --strict