name: Backend tests

# Статус для merge: БЛОКИРУЕТ. Required check называется `backend tests` — ровно
# `name:` джоба ниже, а не `name:` workflow. Состав блокирующих проверок живёт вне
# этого файла: сверять чтением `gh api repos/mavkasgit/ktm2000/branches/main/protection`
# и таблицей `docs/testing-guide.md` (§CI). #370.

# Полный pytest-набор backend с coverage-гейтом на push/PR.
# Решения грилла #245: Q1=2 (блокирует PR), Q13=а (гейт backend на 73%),
# Q23=а (один джоб вместо двух). Q21 (coverage отдельным pip install) отменён
# #377: coverage приходит пином из `backend/requirements-dev.txt`, вместе с
# pytest и ruff, — литералов версий в теле workflow нет.
#
# Прогон параллельный: `-n 4 --dist loadfile` (#378). Под xdist воркеры — отдельные
# процессы, поэтому coverage стартует в каждом из них (`COVERAGE_PROCESS_START`
# + `sitecustomize.py`, штатный механизм для subprocess-ов) и сводится
# `coverage combine` до порога; иначе гейт мерил бы только диспетчер тестов.
# Цифры решения — в шаге прогона (serial против `-n 4` на одной ревизии).
# #378: для ручного чередования 2+2 служит input workflow_dispatch.pytest_mode
# (serial|parallel); локальный A/B и честная оговорка про CI — в
# docs/night/tickets/T-20261123-C-378.md. Локальные цифры НЕ являются CI-результатом.
# -p no:pytest-testmon — testmon не должен пропускать тесты в CI; блокируется
# по имени entry point (pytest-testmon), а не по имени модуля testmon.
# Пин 7.17.2 — patch-обновление к бейзлайну 73% (docs/night/BASELINE.md). Если цифра
# в CI разойдётся с локальной — сначала разобраться почему, порог не подгонять.
# Гейт: coverage сравнивает round(total, 0) < fail_under (precision=0 — дефолт,
# --precision не задан), поэтому реально проходит любой итог >72.5% (72.6
# округляется вверх до 73); ровно 72.5 падает — round к чётному даёт 72.
#
# Оговорка Q23: падение serial-прогона на локально-зелёном тесте — сначала
# проверить зависимость от порядка/общего состояния, и только потом чинить тест.
# Имя джоба `backend tests` — оно же имя required check (настройка #254):
# при смене имени обновить branch protection.
#
# #361 concurrency: одна группа на (workflow, PR или ветка), устаревший прогон
# отменяется. На push в main `cancel-in-progress` выключен: каждый коммит main
# должен быть проверен до конца (на нём держатся серия зелёных для промоушена
# e2e-smoke и история coverage-гейта 73%).
# #361 path scope: скоуп считается шагом внутри джоба, а НЕ фильтром `paths`
# уровня workflow. Причина числом из документации GitHub (workflow-syntax,
# раздел `on.<push|pull_request>.<branches>`): «If a workflow is skipped due to
# branch filtering, path filtering, or a commit message, then checks associated
# with that workflow will remain in a "Pending" state. A pull request that
# requires those checks to be successful will be blocked from merging».
# `backend tests` — required (gh api branches/main/protection → contexts),
# поэтому workflow-фильтр на нём запрещён; пропуск дорогих шагов внутри
# всегда запускающегося джоба даёт skipped/success и branch protection не вешает.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    # #378: ручной A/B-замер стены. Боевой режим — parallel (как на push/PR);
    # serial существует ТОЛЬКО чтобы человек с правами администратора репозитория
    # мог прогнать чередование 2+2 (serial/parallel/serial/parallel) через
    # workflow_dispatch и приложить `gh run view --json jobs` к тикету.
    # Агент эти прогоны не запускает: dispatch требует прав репозитория.
    inputs:
      pytest_mode:
        description: "Режим pytest: parallel = -n 4 --dist loadfile, serial = без xdist"
        required: true
        default: parallel
        type: choice
        options:
          - parallel
          - serial

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

# #363 [missing-permissions]: по умолчанию GITHUB_TOKEN получает запись во все скоупы
# репозитория. Здесь читаем — поэтому верхний уровень только `contents: read`.
permissions:
  contents: read

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # #363 [unpinned-images]: тег `postgres:15` mutable — раннер может получить
        # другой патч-релиз между прогонами. Дайджест индекса манифестов (multi-arch),
        # получен локально: `docker buildx imagetools inspect postgres:15` -> 15.19.
        image: postgres:15@sha256:40e8c839f86c404f9bd1c456bb83f11b205f2cd95d753b34c2d074e89ecee786 # postgres 15.19
        env:
          POSTGRES_USER: ktm2000_user
          POSTGRES_PASSWORD: ktm2000_pass_test
          POSTGRES_DB: ktm2000_test
        ports:
          - 5212:5432
        options: >-
          --health-cmd "pg_isready -U ktm2000_user -d ktm2000_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5212"
      ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # #363 [artipacked]: checkout иначе пишет GITHUB_TOKEN в .git/config workspace,
          # откуда его может увести любой последующий шаг (upload-artifact и т. п.).
          # Ни один шаг этих джобов не пушит: push — действие человека/оркестратора.
          persist-credentials: false

      # #361: дешёвый определитель «есть ли в PR изменения в зоне backend».
      # Список изменений — из compare API (`base...head`); при любой невозможности
      # его получить relevant=true (fail-open: дороже прогнать набор, чем пропустить).
      # Локальный прогон этого же скрипта на реальных
      # коммитах истории — в комментарии к issue #361.
      - name: Path scope (зона backend)
        id: scope
        shell: bash
        env:
          KTM_BASE: ${{ github.event.pull_request.base.sha }}
          KTM_HEAD: ${{ github.event.pull_request.head.sha }}
          KTM_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PATTERN='^(backend|scripts|infra)/|^package(-lock)?\.json$|^ports\.json$|^ruff\.toml$|^\.github/workflows/backend-tests\.yml$'
          say() {
            echo "relevant=$1" >> "$GITHUB_OUTPUT"
          }
          if [ "$KTM_EVENT" != "pull_request" ]; then
            echo "event=$KTM_EVENT — скоуп не применяется, прогон полный"
            say true; exit 0
          fi
          # Список файлов берём из compare API, а не из `git diff`: checkout с
          # `persist-credentials: false` (#363) не даёт ходовой учётных данных для
          # дозапроса base-объекта в shallow-checkout, а API работает штатным
          # GITHUB_TOKEN с permissions contents: read.
          # `--jq` встроен в gh (gojq) — отдельный jq на раннере не нужен.
          if ! CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/compare/$KTM_BASE...$KTM_HEAD" --jq '.files[]?.filename' 2>/dev/null); then
            echo "compare API недоступен — прогон полный (fail-open)"
            say true; exit 0
          fi
          NFILES=$(printf '%s' "$CHANGED" | grep -c . || true)
          if [ "$NFILES" -ge 300 ]; then
            echo "compare API обрезал список на 300 файлах — прогон полный (fail-open)"
            say true; exit 0
          fi
          printf 'Изменённые файлы PR (%s):\n%s\n' "$NFILES" "$CHANGED"
          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qE "$PATTERN"; then
            echo "Зона backend затронута (или изменений нет — на всякий случай гоняем)"
            say true
          else
            echo "Зона backend не затронута ни одним изменённым файлом — дорогие шаги пропускаем"
            say false
          fi

      # #362: версии языка берутся из pin-файлов репозитория (#355 оркестратора:
      # `.nvmrc`, `.python-version`). Файла нет — шаг материализует временный
      # `.ci-*-version` в workspace прогона (в git не попадает) со значением, которое
      # стояло в этом workflow до волны, и печатает WARNING. Прогон зелёный уже
      # сегодня; когда pin-файлы появятся, правки в workflow не нужны — тот же путь,
      # другое содержимое.
      - name: Toolchain pin (#362)
        id: toolchain
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        env:
          KTM_PY_FALLBACK: '3.14.10'
          KTM_USE_NODE: 'no'
          KTM_USE_PY: 'yes'
        run: |
          set -euo pipefail
          pick() {
            local src="$1" fb="$2" dst="$3" raw
            if [ -f "$src" ]; then
              raw=$(tr -d ' \t\r\n' < "$src")
              echo "$src -> $raw (pin-файл репозитория)"
            else
              raw="$fb"
              echo "WARNING: pin-файла $src нет (#355 не влит) — беру литерал workflow $raw"
            fi
            if [ -z "$raw" ]; then
              echo "Пустая версия языка ($src/$fb) — падаю, а не ставлю тихий дефолт" >&2
              exit 1
            fi
            printf '%s\n' "${raw#v}" > "$dst"
            echo "$dst: $(cat "$dst")"
          }
          if [ "$KTM_USE_NODE" = yes ]; then
            pick .nvmrc "$KTM_NODE_FALLBACK" .ci-node-version
            echo "node_file=.ci-node-version" >> "$GITHUB_OUTPUT"
          fi
          if [ "$KTM_USE_PY" = yes ]; then
            pick .python-version "$KTM_PY_FALLBACK" .ci-python-version
            echo "python_file=.ci-python-version" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ${{ steps.toolchain.outputs.python_file }}
          cache: pip
          # Кеш зависит от обоих файлов: джоб ставит requirements-dev.txt, а он
          # подтягивает runtime через `-r requirements.txt` (#377).
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # Один install, ровно как на dev-машине (#377): requirements-dev.txt
      # подтягивает `-r requirements.txt` и держит пины coverage/pytest/ruff.
      # Литerals в теле workflow не дублируются — иначе джоб ставит не тот
      # набор, что venv, и падает только в CI (пример: Pillow из dev-файла,
      # без которого `tests/test_sync_ekranchik.py` не собирается).
      - name: Install backend dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pip install -r backend/requirements-dev.txt

      # Рэтчет числа тестов (#358) — до прогона: если набор стал меньше
      # записанного, падать должен именно этот шаг, а не «pytest прошёл быстрее».
      # #364: команда — шаг гейта `backend-test-count`, а не своя копия.
      - name: Test-count ratchet (pytest)
        if: steps.scope.outputs.relevant == 'true'
        run: npm run gate -- --only=backend-test-count

      # run-DB создаётся и удаляется тем же скриптом, что и на dev-машине:
      # изоляция прогона остаётся той же, без отдельной CI-обвязки.
      #
      # #378: прогон параллельный (`-n 4 --dist loadfile`, замеры ниже), и под
      # xdist coverage нельзя запускать через `coverage run` в controller:
      # воркеры — отдельные процессы (execnet), controller их не инструментирует,
      # и гейт мерил бы только код диспетчера. Штатный механизм coverage для
      # subprocess-ов: `COVERAGE_PROCESS_START` + `coverage.process_startup()`
      # на старте каждого интерпретатора (`sitecustomize.py` на `PYTHONPATH`;
      # PYTHONPATH и переменная наследуются воркерами). Каждый процесс пишет
      # свой `.coverage.*`, `coverage combine` складывает их до порога.
      # Механика проверена отдельно: два процесса, две функции, общая сводка
      # 100% — ни одна из них не покрыта одним процессом целиком.
      #
      # Замер на одной ревизии (0bd84c00, 2026-11-18, весь набор включая slow;
      # в обоих прогонах 2464 passed / 2 skipped):
      #   serial              — 983.9 с (wall), pytest 968.43 с;
      #   -n 4 --dist loadfile — 290.1 с (wall), pytest 283.16 с, −70.5%.
      # Флаки не растили: прогоны по одному разу, `--retries` не включались.
      # Чередование 2+2 через workflow_dispatch — после merge (dispatch берёт
      # workflow только с default-ветки).
      - name: Run backend test suite with coverage
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          RUN_ID=$(python -c "import uuid; print(uuid.uuid4().hex[:12])")
          DB_NAME="ktm2000_test_${RUN_ID}"
          python "$GITHUB_WORKSPACE/scripts/test-db.py" create "$DB_NAME"
          trap 'python "$GITHUB_WORKSPACE/scripts/test-db.py" drop "$DB_NAME" >/dev/null 2>&1 || true' EXIT

          # coverage для каждого процесса, включая execnet-воркеры xdist
          mkdir -p .ci-coverage
          printf 'import coverage\ncoverage.process_startup()\n' > .ci-coverage/sitecustomize.py
          printf '[run]\nsource = app\nparallel = true\n' > .coveragerc.ci
          export PYTHONPATH="$GITHUB_WORKSPACE/.ci-coverage${PYTHONPATH:+:$PYTHONPATH}"
          export COVERAGE_PROCESS_START="$GITHUB_WORKSPACE/.coveragerc.ci"

          # #378: режим выбирается только в workflow_dispatch. На push/PR input
          # отсутствует — боевой parallel; serial нужен человеку для чередования
          # 2+2 и замера стены CI. Оба режима гоняют ОДИН и тот же набор тестов
          # и один и тот же coverage-гейт (sitecustomize стартует и в serial).
          PYTEST_MODE="${{ github.event.inputs.pytest_mode }}"
          if [ -z "$PYTEST_MODE" ]; then PYTEST_MODE="parallel"; fi
          case "$PYTEST_MODE" in
            parallel) PYTEST_SCHEDULER=(-n 4 --dist loadfile) ;;
            serial)   PYTEST_SCHEDULER=(-p no:xdist) ;;
            *) echo "Неизвестный pytest_mode=$PYTEST_MODE" >&2; exit 1 ;;
          esac
          echo "pytest_mode=$PYTEST_MODE; scheduler=${PYTEST_SCHEDULER[*]}"

          cd backend
          TEST_RUN_ID="$RUN_ID" \
          TEST_DB_NAME="$DB_NAME" \
          TEST_DATABASE_URL="postgresql+asyncpg://ktm2000_user:ktm2000_pass_test@localhost:5212/${DB_NAME}" \
          python -m pytest -q "${PYTEST_SCHEDULER[@]}" -p no:pytest-testmon
          python -m coverage combine

      - name: Coverage gate (>= 73%)
        if: steps.scope.outputs.relevant == 'true'
        working-directory: backend
        run: python -m coverage report --fail-under=73

      # Report-only: скрипт по устройству возвращает 0 (см. `--strict` для
      # будущего включения в блокирующий CI). Рядом живёт ruff.yml — он тоже
      # report-only, см. решения #245 (Q5=2, Q15=а).
      - name: Test hygiene report (report-only)
        if: steps.scope.outputs.relevant == 'true'
        run: python scripts/check-test-imports.py
