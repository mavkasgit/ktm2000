name: Backend tests (manual)

# Ручной запуск набора backend-тестов на Linux.
#
# Почему только `workflow_dispatch`: включение прогона в push/PR — решение про
# минуты CI и политику, а не техническая мелочь (см. `docs/night/BACKLOG.md`,
# B-0001). Команды этого workflow проверены локально: тот же набор прогнан в
# контейнере `python:3.12-slim` против сервиса того же образа Postgres —
# 1951 passed, 0 failed, 43 warnings (логи ночной сессии, `logs/linux-run.log`).
# Платформенных падений на Linux нет — набор не зависит от Windows.
#
# Пока прогон не включён в обычный CI, красный набор там никого не блокирует.
on:
  workflow_dispatch:

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ktm2000_user
          POSTGRES_PASSWORD: ktm2000_pass_test
          POSTGRES_DB: ktm2000_test
        ports:
          - 5212:5432
        options: >-
          --health-cmd "pg_isready -U ktm2000_user -d ktm2000_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5212"
      ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # run-DB создаётся и удаляется тем же скриптом, что и на dev-машине:
      # изоляция прогона остаётся той же, без отдельной CI-обвязки.
      - name: Run backend test suite
        run: |
          RUN_ID=$(python -c "import uuid; print(uuid.uuid4().hex[:12])")
          DB_NAME="ktm2000_test_${RUN_ID}"
          python scripts/test-db.py create "$DB_NAME"
          trap 'python scripts/test-db.py drop "$DB_NAME" >/dev/null 2>&1 || true' EXIT
          cd backend
          TEST_RUN_ID="$RUN_ID" \
          TEST_DB_NAME="$DB_NAME" \
          TEST_DATABASE_URL="postgresql+asyncpg://ktm2000_user:ktm2000_pass_test@localhost:5212/${DB_NAME}" \
          python -m pytest -q -n 4 --dist loadfile
