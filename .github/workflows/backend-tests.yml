name: Backend tests

# Полный pytest-набор backend с coverage-гейтом на push/PR.
# Решения грилла #245: Q1=2 (блокирует PR), Q13=а (гейт backend на 73%),
# Q21 (coverage==7.16.2 отдельным pip install, requirements/Docker не трогаем),
# Q23=а (один джоб вместо двух).
#
# Прогон серийный, без xdist: под -n воркеры остаются вне замера coverage
# (controller меряет только главный процесс) и гейт упал бы на ровном месте.
# -p no:pytest-testmon — testmon не должен пропускать тесты в CI; блокируется
# по имени entry point (pytest-testmon), а не по имени модуля testmon.
# Пин 7.16.2 — на нём снят бейзлайн 73% (docs/night/BASELINE.md). Если цифра
# в CI разойдётся с локальной — сначала разобраться почему, порог не подгонять.
# Гейт: coverage сравнивает round(total, 0) < fail_under (precision=0 — дефолт,
# --precision не задан), поэтому реально проходит любой итог >72.5% (72.6
# округляется вверх до 73); ровно 72.5 падает — round к чётному даёт 72.
#
# Оговорка Q23: падение serial-прогона на локально-зелёном тесте — сначала
# проверить зависимость от порядка/общего состояния, и только потом чинить тест.
# Имя джоба `backend tests` — оно же имя required check (настройка #254):
# при смене имени обновить branch protection.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ktm2000_user
          POSTGRES_PASSWORD: ktm2000_pass_test
          POSTGRES_DB: ktm2000_test
        ports:
          - 5212:5432
        options: >-
          --health-cmd "pg_isready -U ktm2000_user -d ktm2000_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5212"
      ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install coverage==7.16.2

      # run-DB создаётся и удаляется тем же скриптом, что и на dev-машине:
      # изоляция прогона остаётся той же, без отдельной CI-обвязки.
      - name: Run backend test suite with coverage
        run: |
          RUN_ID=$(python -c "import uuid; print(uuid.uuid4().hex[:12])")
          DB_NAME="ktm2000_test_${RUN_ID}"
          python "$GITHUB_WORKSPACE/scripts/test-db.py" create "$DB_NAME"
          trap 'python "$GITHUB_WORKSPACE/scripts/test-db.py" drop "$DB_NAME" >/dev/null 2>&1 || true' EXIT
          cd backend
          TEST_RUN_ID="$RUN_ID" \
          TEST_DB_NAME="$DB_NAME" \
          TEST_DATABASE_URL="postgresql+asyncpg://ktm2000_user:ktm2000_pass_test@localhost:5212/${DB_NAME}" \
          python -m coverage run --source=app -m pytest -q -p no:xdist -p no:pytest-testmon

      - name: Coverage gate (>= 73%)
        working-directory: backend
        run: python -m coverage report --fail-under=73

      # Report-only: скрипт по устройству возвращает 0 (см. `--strict` для
      # будущего включения в блокирующий CI). Рядом живёт ruff.yml — он тоже
      # report-only, см. решения #245 (Q5=2, Q15=а).
      - name: Test hygiene report (report-only)
        run: python scripts/check-test-imports.py
