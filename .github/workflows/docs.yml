name: Docs

# Ссылки в документации — блокирующая проверка.
#
# Что именно в скоупе — `scripts/check-doc-links-core.js`, а не этот комментарий:
# инвариант один, каждая относительная ссылка в `.md` резолвится в файл из
# `git ls-files`. Якоря, схемы и внешние URL выведены из скоупа там же.
#
# Зачем отдельный workflow: остальные проверяют код (ruff, tsc, vitest, pytest,
# alembic). Переименование документа оставляет все их зелёными — ловит только
# этот джоб. Три ссылки на ADR в `docs/plan-import-spec.md` висели битыми до его
# появления.
#
# Локальный запуск — та же команда: `npm run check:docs` из корня.
# `test:scripts` едет сюда же: у скриптов есть тесты, и без этого джоба они
# никогда не исполнялись в CI.
#
# #361: джоб `docs` НЕ входит в required contexts (проверено чтением
# `gh api repos/mavkasgit/ktm2000/branches/main/protection` — contexts =
# migrations, backend tests, frontend tests, ruff). Только поэтому здесь
# разрешён фильтр `paths` уровня workflow: его срабатывание не оставит
# required check в "Pending". Меняется состав required-проверок —
# фильтр надо снимать (иначе правки вне скоупа молча не проверяются).
on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Doc links
        run: npm run check:docs

      - name: Script tests
        run: npm run test:scripts