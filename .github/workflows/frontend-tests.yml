name: Frontend tests

# tsc + ESLint + vitest с покрытием на push/PR. Решения грилла #245: Q14=1
# (набор в CI), Q4=1 (покрытие меряем), Q22 (typecheck отдельным шагом, vite
# build не дублируем), Q13 (без порога: первое число frontend-покрытия ещё не
# снято, гейт — отдельным решением позже). ESLint добавлен в набор ради
# архитектурных границ FSD (#333): tsc их не видит.
# Имя джоба `frontend tests` — оно же имя required check (настройка #254).
# #361: скоуп по путям считается шагом внутри джоба (не фильтром `paths` уровня
# workflow) — required check от workflow-фильтра повис бы в "Pending" и
# заблокировал merge (документация GitHub, `on.<push|pull_request>`). Поэтому
# первоначальная договорённость «фильтров нет намеренно» сохранена по смыслу:
# джоб запускается всегда, а дорогой набор пропускается только когда в PR нет
# ни одного файла зоны frontend.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

# #363 [missing-permissions]: по умолчанию GITHUB_TOKEN получает запись во все скоупы
# репозитория. Здесь читаем — поэтому верхний уровень только `contents: read`.
permissions:
  contents: read

jobs:
  frontend-tests:
    name: frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # #363 [artipacked]: checkout иначе пишет GITHUB_TOKEN в .git/config workspace,
          # откуда его может увести любой последующий шаг (upload-artifact и т. п.).
          # Ни один шаг этих джобов не пушит: push — действие человека/оркестратора.
          persist-credentials: false

      # #361: зона фронта = frontend/** + корневые npm-файлы + сам workflow.
      # Невозможность получить список изменений → relevant=true (fail-open).
      - name: Path scope (зона frontend)
        id: scope
        shell: bash
        env:
          KTM_BASE: ${{ github.event.pull_request.base.sha }}
          KTM_HEAD: ${{ github.event.pull_request.head.sha }}
          KTM_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PATTERN='^frontend/|^package(-lock)?\.json$|^\.github/workflows/frontend-tests\.yml$'
          say() {
            echo "relevant=$1" >> "$GITHUB_OUTPUT"
          }
          if [ "$KTM_EVENT" != "pull_request" ]; then
            echo "event=$KTM_EVENT — скоуп не применяется, прогон полный"
            say true; exit 0
          fi
          # Список файлов берём из compare API, а не из `git diff`: checkout с
          # `persist-credentials: false` (#363) не даёт ходовой учётных данных для
          # дозапроса base-объекта в shallow-checkout, а API работает штатным
          # GITHUB_TOKEN с permissions contents: read.
          # `--jq` встроен в gh (gojq) — отдельный jq на раннере не нужен.
          if ! CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/compare/$KTM_BASE...$KTM_HEAD" --jq '.files[]?.filename' 2>/dev/null); then
            echo "compare API недоступен — прогон полный (fail-open)"
            say true; exit 0
          fi
          NFILES=$(printf '%s' "$CHANGED" | grep -c . || true)
          if [ "$NFILES" -ge 300 ]; then
            echo "compare API обрезал список на 300 файлах — прогон полный (fail-open)"
            say true; exit 0
          fi
          printf 'Изменённые файлы PR (%s):\n%s\n' "$NFILES" "$CHANGED"
          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qE "$PATTERN"; then
            echo "Зона frontend затронута — прогон полный"
            say true
          else
            echo "Ни одного файла зоны frontend не изменено — tsc/eslint/vitest пропускаем"
            say false
          fi

      # #362: версии языка берутся из pin-файлов репозитория (#355 оркестратора:
      # `.nvmrc`, `.python-version`). Файла нет — шаг материализует временный
      # `.ci-*-version` в workspace прогона (в git не попадает) со значением, которое
      # стояло в этом workflow до волны, и печатает WARNING. Прогон зелёный уже
      # сегодня; когда pin-файлы появятся, правки в workflow не нужны — тот же путь,
      # другое содержимое.
      - name: Toolchain pin (#362)
        id: toolchain
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        env:
          KTM_NODE_FALLBACK: '20'
          KTM_USE_NODE: 'yes'
          KTM_USE_PY: 'no'
        run: |
          set -euo pipefail
          pick() {
            local src="$1" fb="$2" dst="$3" raw
            if [ -f "$src" ]; then
              raw=$(tr -d ' \t\r\n' < "$src")
              echo "$src -> $raw (pin-файл репозитория)"
            else
              raw="$fb"
              echo "WARNING: pin-файла $src нет (#355 не влит) — беру литерал workflow $raw"
            fi
            if [ -z "$raw" ]; then
              echo "Пустая версия языка ($src/$fb) — падаю, а не ставлю тихий дефолт" >&2
              exit 1
            fi
            printf '%s\n' "${raw#v}" > "$dst"
            echo "$dst: $(cat "$dst")"
          }
          if [ "$KTM_USE_NODE" = yes ]; then
            pick .nvmrc "$KTM_NODE_FALLBACK" .ci-node-version
            echo "node_file=.ci-node-version" >> "$GITHUB_OUTPUT"
          fi
          if [ "$KTM_USE_PY" = yes ]; then
            pick .python-version "$KTM_PY_FALLBACK" .ci-python-version
            echo "python_file=.ci-python-version" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ steps.toolchain.outputs.node_file }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: npm ci

      - name: Typecheck (tsc -b)
        if: steps.scope.outputs.relevant == 'true'
        run: npx tsc -b

      - name: ESLint (архитектурные границы FSD)
        if: steps.scope.outputs.relevant == 'true'
        run: npm run lint

      - name: Vitest with coverage (report-only, no threshold yet)
        if: steps.scope.outputs.relevant == 'true'
        run: npm test -- --coverage
