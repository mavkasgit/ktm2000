name: Ruff

# ruff — блокирующая проверка backend. Решения грилла #245: Q5=2 (скоуп backend),
# Q15=а (отдельный workflow), Q13=а (переведён из report-only в блокирующий —
# ядро доведено до нуля).
#
# Что именно в скоупе — источник правды `ruff.toml`, а не этот комментарий: там
# `select` из кодов, каждый из которых доведён до нуля отдельной волной (#248
# pyflakes-ядро, #260 механические семейства, #259/#245 закрытие контура —
# DTZ, BLE, S110, ASYNC, PLW1510, TRY004/201/401, PLR0124/1704, PERF102, G201,
# RUF*, PYI*, RET501, B010, D419), и явный список отклонённого с причинами
# (PLC0414, TRY003/300/301, PLR2004/PLR09xx, RUF001/002/003, UP042, UP047).
# Красный джоб возможен только от нового кода — в этом и смысл.
#
# Локальный запуск — та же команда: `ruff check backend` из корня подхватывает
# `ruff.toml` автоматически. Откат к report-only — одна строка
# `continue-on-error: true`. --fix не используется: линтер ничего не меняет.
# Версия закреплена (0.16.9) — на ней снят ноль находок и посчитан скоуп.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (pinned)
        run: pip install ruff==0.16.9

      - name: Ruff check backend
        run: ruff check backend
