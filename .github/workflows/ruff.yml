name: Ruff

# Статус для merge: БЛОКИРУЕТ. Required check называется `ruff` — ровно `name:`
# джоба ниже, а не `name:` workflow. Состав блокирующих проверок живёт вне этого
# файла: сверять чтением `gh api repos/mavkasgit/ktm2000/branches/main/protection`
# и таблицей `docs/testing-guide.md` (§CI). #370.

# ruff — блокирующая проверка backend. Решения грилла #245: Q5=2 (скоуп backend),
# Q15=а (отдельный workflow), Q13=а (переведён из report-only в блокирующий —
# ядро доведено до нуля).
#
# Что именно в скоупе — источник правды `ruff.toml`, а не этот комментарий: там
# `select` из кодов, каждый из которых доведён до нуля отдельной волной (#248
# pyflakes-ядро, #260 механические семейства, #259/#245 закрытие контура —
# DTZ, BLE, S110, ASYNC, PLW1510, TRY004/201/401, PLR0124/1704, PERF102, G201,
# RUF*, PYI*, RET501, B010, D419), и явный список отклонённого с причинами
# (PLC0414, TRY003/300/301, PLR2004/PLR09xx, RUF001/002/003, UP042, UP047).
# Красный джоб возможен только от нового кода — в этом и смысл.
#
# Локальный запуск — та же команда: `ruff check backend` из корня подхватывает
# `ruff.toml` автоматически. Откат к report-only — одна строка
# `continue-on-error: true`. --fix не используется: линтер ничего не меняет.
# Версия закреплена (0.16.9) — на ней снят ноль находок и посчитан скоуп.
#
# #361 concurrency: группа на (workflow, PR/ветка), отмена устаревшего прогона
# (кроме push в main). Path scope — шагом внутри джоба, а не `paths` уровня
# workflow: `ruff` входит в required contexts (gh api branches/main/protection),
# а отфильтрованный по путям workflow оставил бы required check в "Pending".
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

# #363 [missing-permissions]: по умолчанию GITHUB_TOKEN получает запись во все скоупы
# репозитория. Здесь читаем — поэтому верхний уровень только `contents: read`.
permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    # #363 [missing-timeout]: замера не было вовсе. По `jactionlint --suggest-timeouts`
    # (20 успешных прогонов, 2026-10-01…2026-11-02): min 0.1, медиана 0.1, max 0.9 мин.
    # 10 минут — >10-кратный запас на холодный кеш и занятый раннер.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # #363 [artipacked]: checkout иначе пишет GITHUB_TOKEN в .git/config workspace,
          # откуда его может увести любой последующий шаг (upload-artifact и т. п.).
          # Ни один шаг этих джобов не пушит: push — действие человека/оркестратора.
          persist-credentials: false

      # #361: скоуп = то, что реально читает `ruff check backend` + конфиг + сам workflow.
      - name: Path scope (зона ruff)
        id: scope
        shell: bash
        env:
          KTM_BASE: ${{ github.event.pull_request.base.sha }}
          KTM_HEAD: ${{ github.event.pull_request.head.sha }}
          KTM_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PATTERN='^backend/|^ruff\.toml$|^\.github/workflows/ruff\.yml$'
          say() {
            echo "relevant=$1" >> "$GITHUB_OUTPUT"
          }
          if [ "$KTM_EVENT" != "pull_request" ]; then
            echo "event=$KTM_EVENT — скоуп не применяется, прогон полный"
            say true; exit 0
          fi
          # Список файлов берём из compare API, а не из `git diff`: checkout с
          # `persist-credentials: false` (#363) не даёт ходовой учётных данных для
          # дозапроса base-объекта в shallow-checkout, а API работает штатным
          # GITHUB_TOKEN с permissions contents: read.
          # `--jq` встроен в gh (gojq) — отдельный jq на раннере не нужен.
          if ! CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/compare/$KTM_BASE...$KTM_HEAD" --jq '.files[]?.filename' 2>/dev/null); then
            echo "compare API недоступен — прогон полный (fail-open)"
            say true; exit 0
          fi
          NFILES=$(printf '%s' "$CHANGED" | grep -c . || true)
          if [ "$NFILES" -ge 300 ]; then
            echo "compare API обрезал список на 300 файлах — прогон полный (fail-open)"
            say true; exit 0
          fi
          printf 'Изменённые файлы PR (%s):\n%s\n' "$NFILES" "$CHANGED"
          if [ -z "$CHANGED" ] || printf '%s\n' "$CHANGED" | grep -qE "$PATTERN"; then
            echo "Зона ruff затронута — прогон полный"
            say true
          else
            echo "Ни одного python-файла скоупа ruff не изменено — pip install и check пропускаем"
            say false
          fi

      # #362: версии языка берутся из pin-файлов репозитория (#355 оркестратора:
      # `.nvmrc`, `.python-version`). Файла нет — шаг материализует временный
      # `.ci-*-version` в workspace прогона (в git не попадает) со значением, которое
      # стояло в этом workflow до волны, и печатает WARNING. Прогон зелёный уже
      # сегодня; когда pin-файлы появятся, правки в workflow не нужны — тот же путь,
      # другое содержимое.
      - name: Toolchain pin (#362)
        id: toolchain
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        env:
          KTM_PY_FALLBACK: '3.12'
          KTM_USE_NODE: 'no'
          KTM_USE_PY: 'yes'
        run: |
          set -euo pipefail
          pick() {
            local src="$1" fb="$2" dst="$3" raw
            if [ -f "$src" ]; then
              raw=$(tr -d ' \t\r\n' < "$src")
              echo "$src -> $raw (pin-файл репозитория)"
            else
              raw="$fb"
              echo "WARNING: pin-файла $src нет (#355 не влит) — беру литерал workflow $raw"
            fi
            if [ -z "$raw" ]; then
              echo "Пустая версия языка ($src/$fb) — падаю, а не ставлю тихий дефолт" >&2
              exit 1
            fi
            printf '%s\n' "${raw#v}" > "$dst"
            echo "$dst: $(cat "$dst")"
          }
          if [ "$KTM_USE_NODE" = yes ]; then
            pick .nvmrc "$KTM_NODE_FALLBACK" .ci-node-version
            echo "node_file=.ci-node-version" >> "$GITHUB_OUTPUT"
          fi
          if [ "$KTM_USE_PY" = yes ]; then
            pick .python-version "$KTM_PY_FALLBACK" .ci-python-version
            echo "python_file=.ci-python-version" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ${{ steps.toolchain.outputs.python_file }}

      - name: Install ruff (pinned)
        if: steps.scope.outputs.relevant == 'true'
        run: pip install ruff==0.16.9

      - name: Ruff check backend
        if: steps.scope.outputs.relevant == 'true'
        run: ruff check backend
