name: Ruff

# ruff — блокирующая проверка backend. Решения грилла #245: Q5=2 (скоуп backend),
# Q15=а (отдельный workflow), Q1=1 (скоуп правил сужен до pyflakes-ядра `F`
# в корневом `ruff.toml`: дефолтный набор давал 3203 находки вперемешку со
# стилем и был нечитаем), Q13=а (переведён из report-only в блокирующий —
# F-ядро доведено до нуля, см. тикет #257).
#
# Почему набор именно `F`: на нём ноль находок, а красный джоб теперь возможен
# только от нового кода — в этом и смысл. Стилевые семейства (FURB157, I001,
# B008, UP*) и сигнальные (DTZ, ASYNC, BLE, S110) в скоуп НЕ входят: первые —
# механика, вторые — отдельный тикет, пока их находки не закрыты.
#
# Локальный запуск — та же команда: `ruff check backend` из корня подхватывает
# `ruff.toml` автоматически. Откат к report-only — одна строка
# `continue-on-error: true`. --fix не используется: линтер ничего не меняет.
# Версия закреплена (0.16.9) — на ней снят ноль находок и посчитан скоуп.
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff (pinned)
        run: pip install ruff==0.16.9

      - name: Ruff check backend
        run: ruff check backend
