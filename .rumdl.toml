# Конфигурация markdown-линтера rumdl — шаг гейта `docs-lint`.
# Версия инструмента пинуется в mise.toml; реестр — tools.json (корень).
#
# Принцип: ловим структурные дефекты, которые ломают рендер и ссылки
# (списки, заголовки, fences, относительные ссылки), а не вкус форматирования.

[global]
# MD013 (длина строки) выключен осознанно: русская проза в docs/ пишется
# абзацем в одну строку, а перенос — работа форматтера, а не гейта.
# Дефолт markdownlint (80) рассчитан на английский с жёстким переносом.
disable = ["MD013"]
# Кэш выключен: прогон по репозиторию занимает доли секунды, а кэш оставляет
# `.rumdl_cache` в корне, которого там быть не должно.
cache = false
# Сгенерированное и служебное: не исходники проекта. `node_modules` и venv
# исключены, чтобы прогон не зависел от состояния локальной установки.
exclude = [
  "node_modules/**",
  "frontend/node_modules/**",
  "backend/.venv/**",
  "test-results/**",
  "playwright-report/**",
  "logs/**",
  ".scratch/**",
  # Служебный каталог git: не рабочее дерево. Там лежат черновики вроде
  # `agents.head.md`, и относительные ссылки из них не разрешаются по
  # определению — линт рабочего дерева к ним отношения не имеет.
  ".git/**",
  # Ночные отчёты: фиксируют состояние на дату прогона и дописываются волной.
  # Править их задним числом значит искажать историю; узкое исключение.
  "docs/night/**",
  "NIGHT_REPORT.md",
  # Исторические планы и спеки: тот же довод — состояние на дату.
  "docs/superpowers/**",
]

[per-file-ignores]
# Шаблон PR: заголовок задаёт GitHub, тело начинается с разделов. H1 в теле
# pull request не нужен, а MD041 требует его в каждом файле.
".github/pull_request_template.md" = ["MD041"]
# README: заголовок — центрированный блок с логотипом в HTML. MD041 ждёт H1
# первой строкой, MD033 запрещает inline HTML; здесь это оформление шапки,
# а не дефект рендера. Узкое исключение на один файл.
"README.md" = ["MD033", "MD041"]
# Сравнительные метки (`**Хорошо**`, `**Плохо**`, `**Нейтрально**`, `**Backend**`)
# внутри разделов-примеров: это эмфаза, а не заголовки. Перевод в `###` изменил
# бы оглавление и структуру уже принятых ADR — правка на вкус, не на дефект.
"docs/adr/0038-semantika-kolonki-i-parametry-zaprosa.md" = ["MD036"]
"docs/adr/0039-stranica-razdela-prishodit-svoim-chankom.md" = ["MD036"]
"docs/adr/0044-popaver-kolonki-tekst-i-znachenie.md" = ["MD036"]
"docs/adr/0063-razmer-na-doske-odin-domen.md" = ["MD036"]
"docs/equivalents-pool-spec.md" = ["MD036"]
# README переносимых модулей сверяются с hrms побайтово по hash
# (scripts/sync-manifest.json): правка fence требует парного изменения и bump
# версии модуля. Это отдельный тикет, а не работа docs-lint.
"frontend/src/modules/notifications/README.md" = ["MD040"]
"frontend/src/modules/user-settings/README.md" = ["MD040"]
